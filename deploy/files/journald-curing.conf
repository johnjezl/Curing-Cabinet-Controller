# Keep crash and power-loss forensics across reboots, in a small, capped journal
# so the SD card sees little write volume. See docs/adr/0204.
[Journal]
Storage=persistent
Compress=yes
SplitMode=none
SystemMaxUse=128M
SystemMaxFileSize=8M
SystemKeepFree=512M
RuntimeMaxUse=16M
MaxRetentionSec=1month
MaxFileSec=1week
SyncIntervalSec=5m
MaxLevelStore=info
ForwardToConsole=no
ForwardToWall=no
